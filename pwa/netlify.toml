[build]
  command = "pnpm --filter pwa build"
  publish = "/pwa/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF pwa package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

