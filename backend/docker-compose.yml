services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plaschema
      POSTGRES_PASSWORD: plaschema
      POSTGRES_DB: plaschema
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plaschema -d plaschema']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - plaschema_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plaschema_pg_data:
