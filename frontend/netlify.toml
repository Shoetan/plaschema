[build]
  command = "pnpm --filter frontend build"
  publish = "/frontend/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF frontend package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

